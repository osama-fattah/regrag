name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Evaluation quality gate (offline baseline)
        run: |
          regrag ingest
          regrag eval --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t regrag .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name regrag regrag
          sleep 5
          curl -sf localhost:8000/health
          curl -sf -X POST localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question":"How long must GxP records be retained?"}'

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
      - name: Lambda image builds
        run: docker build -f Dockerfile.lambda -t regrag-lambda .

  finetune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch, transformers, peft
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,finetune]"
      - name: LoRA fine-tuning tests (tiny local model)
        run: pytest -q tests/test_finetune.py
