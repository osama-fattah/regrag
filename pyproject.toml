[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regrag"
version = "0.1.0"
description = "Agentic, evaluated RAG for pharma GxP and regulatory knowledge (LangGraph, hybrid retrieval, Bedrock / Azure OpenAI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Osama Mohammad Abdul Fattah" }]
dependencies = [
  "langgraph>=0.2",
  "numpy>=1.26",
  "pypdf>=4.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "mcp>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
bedrock = ["boto3>=1.34"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
regrag = "regrag.cli:main"
regrag-mcp = "regrag.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
